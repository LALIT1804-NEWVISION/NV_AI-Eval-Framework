[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nv-ai-eval"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "deepeval==4.1.5",
  "pytest==8.3.3",
  "allure-pytest==2.13.5",
  "pyyaml>=6",
  "python-dotenv>=1",
  "ollama==0.6.3",   # DeepEval's OllamaModel needs it, but DeepEval doesn't install it
]

[project.optional-dependencies]
dev = ["ruff==0.8.4", "build>=1.2", "actionlint-py==1.7.12.25"]
vector = ["chromadb==1.5.9"]   # only for adapter.rag_demo.use_vector_db: true

[tool.setuptools.packages.find]
include = ["nv_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # lets the rag_demo adapter import apps/ from the repo root
addopts = "-ra --alluredir=allure-results --clean-alluredir"   # each run starts with an empty allure-results/
asyncio_default_fixture_loop_scope = "function"
markers = [
  "llm: needs a real judge model (Ollama/Azure); skipped in CI",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["apps"]   # sample apps keep their original style

[tool.ruff.lint]
select = ["E", "F", "I"]
